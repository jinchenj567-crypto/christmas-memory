<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#020308" />
    <title>A Year in Light</title>
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 50%, #0b1124 0%, #04060f 60%, #020308 100%);
        color: #f3d08a;
        font: italic 26px Georgia, 'Times New Roman', serif;
        transition: opacity 0.9s ease, visibility 0.9s;
      }
      #loader.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loader i {
        width: 46px;
        height: 46px;
        background: #ffcf6a;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        filter: drop-shadow(0 0 14px rgba(255, 190, 90, 0.8));
        animation: loader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        50% {
          transform: scale(0.82);
          opacity: 0.6;
        }
      }
      #visits {
        position: fixed;
        left: 12px;
        top: calc(10px + env(safe-area-inset-top));
        z-index: 20;
        padding: 4px 10px;
        border-radius: 99px;
        background: rgba(4, 6, 15, 0.55);
        color: #f3d08a;
        font: 12px/1.6 system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loader"><i></i>Merry Christmas</div>
    <!-- visit counter (不蒜子): counted for everyone, shown only when the address ends in ?stats -->
    <div id="visits" hidden>浏览 <span id="busuanzi_value_site_pv">…</span> 次 · <span id="busuanzi_value_site_uv">…</span> 人</div>
    <script>
      if (/[?&]stats/.test(location.search)) document.getElementById('visits').hidden = false
    </script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
